[project]
name = "ai-reasearch-paper-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "fonttools>=4.66.1",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.6",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf4llm>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-reasearch-paper-assistant = "ai_reasearch_paper_assistant:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
